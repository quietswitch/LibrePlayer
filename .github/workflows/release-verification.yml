name: Release verification

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36'

      - name: Verify LibrePlayer 1.1.0
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest lintDebug assembleDebug assembleRelease :app:assembleDebugAndroidTest :benchmark:assembleBenchmark --console=plain

      - name: Verify declared version
        run: |
          grep -F 'versionCode = 6' app/build.gradle.kts
          grep -F 'versionName = "1.1.0"' app/build.gradle.kts

      - name: Hash unsigned release APK
        run: |
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee app-release-unsigned.apk.sha256

      - name: Upload release-verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: libreplayer-1.1.0-release-verification
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app-release-unsigned.apk.sha256
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
